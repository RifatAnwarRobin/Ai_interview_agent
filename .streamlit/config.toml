[theme]
base = "dark"
primaryColor = "#6366F1"
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#151823"
textColor = "#E6E7EA"
font = "sans serif"

[server]
runOnSave = true
headless = true
port = 8501

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
